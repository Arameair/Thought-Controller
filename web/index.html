<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thought Controller</title>
<style>
:root{
  --bg:#0e0f12; --bg2:#15171c; --card:#1c1f26; --card2:#232731; --line:#2c313c;
  --text:#eceae5; --muted:#9a9ca3; --faint:#6b6e76;
  --live:#5fd39a; --live-bg:#12291f; --warn:#e8b04a; --warn-bg:#3a2d12; --bad:#ff7b72; --bad-bg:#2a1513;
  --cont:#7aa7ff; --act:#5fd39a; --sleep:#b59bff; --res:#8b8f99; --spark:#f0b85a; --trace:#7fb0e0;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:8px;padding:7px 12px}
button:hover{border-color:#4a5060}
button.primary{background:var(--text);color:#111;border-color:var(--text);font-weight:600}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
a{color:var(--cont)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.srcbar{padding:7px 20px;font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.srcbar.live{background:var(--live-bg);color:var(--live)} .srcbar.down{background:var(--bad-bg);color:var(--bad)} .srcbar.wait{background:var(--bg2);color:var(--muted)}
.srcbar b{letter-spacing:.08em}
.srcbar .mode{background:var(--warn-bg);color:var(--warn);border-radius:5px;padding:1px 7px;font-weight:600}
header{display:flex;align-items:center;gap:10px 14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px}
.brand span{color:var(--spark)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill.ok .dot{background:var(--live)} .pill.bad .dot{background:var(--bad)} .pill.warn .dot{background:var(--warn)}
.spacer{flex:1}
main{padding:22px 20px 60px;max-width:1400px;margin:0 auto}
h1{font-size:30px;margin:0 0 6px;font-weight:700} h2{font-size:18px;margin:0 0 10px;font-weight:650}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:14px;border:1px solid var(--line);background:var(--bg2)}
.banner.bad{border-color:#6b2a26;background:var(--bad-bg);color:var(--bad)} .banner.warn{border-color:#5a4518;background:var(--warn-bg);color:var(--warn)}
.who{text-align:center;padding:30px 0 6px} .who h1{font-weight:500;font-size:34px}
.profiles{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:26px 0}
.profile{width:170px;text-align:center;cursor:pointer;background:none;border:none;padding:0;color:var(--muted)}
.profile .face{width:170px;height:170px;border-radius:14px;display:grid;place-items:center;font-size:62px;font-weight:700;color:#fff;border:3px solid transparent;transition:border-color .15s,transform .15s}
.profile:hover .face,.profile:focus-visible .face{border-color:var(--text);transform:translateY(-2px)}
.profile:hover{color:var(--text)}
.profile .name{margin-top:12px;font-size:17px;color:inherit}
.profile .meta{font-size:12.5px;color:var(--faint);margin-top:3px}
.face.ai_companion{background:linear-gradient(135deg,#3a6df0,#7b4bd6)} .face.business{background:linear-gradient(135deg,#1f9e78,#3b7d3a)}
.face.person{background:linear-gradient(135deg,#d0673a,#a83d5a)} .face.project{background:linear-gradient(135deg,#7d6b2e,#b08a2a)} .face.other{background:linear-gradient(135deg,#59606e,#3a3f4a)}
.face.system{background:repeating-linear-gradient(45deg,#262a33,#262a33 10px,#20242c 10px,#20242c 20px);color:var(--muted)}
.face.off{filter:grayscale(.85) brightness(.75)}
.gb{display:inline-block;font-size:10.5px;letter-spacing:.07em;font-weight:700;border-radius:4px;padding:2px 6px;margin-top:6px}
.gb.on{background:var(--live-bg);color:var(--live)} .gb.offb{background:#26282d;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--muted)}
.tab.on{color:var(--text);border-color:var(--text)}
.tab .mini{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.hero{display:grid;grid-template-columns:96px 1fr auto;gap:16px 22px;align-items:center;padding:22px;border-radius:14px;background:linear-gradient(90deg,#1a1d24,#14161b);border:1px solid var(--line);margin-bottom:22px}
.hero .face{width:96px;height:96px;font-size:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff}
.counts{display:flex;gap:6px 18px;margin-top:10px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted);white-space:nowrap} .count b{color:var(--text);font-size:16px;margin-right:4px}
@media (max-width:760px){.hero{grid-template-columns:72px 1fr}.hero .face{width:72px;height:72px;font-size:30px}.hero>.side{grid-column:1/-1}}
.row{margin-bottom:24px}
.row h2{display:flex;align-items:center;gap:10px} .row h2 .n{font-size:13px;color:var(--faint);font-weight:400}
.row .sub{font-size:13px;color:var(--faint);margin:-6px 0 8px}
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{height:8px}.rail::-webkit-scrollbar-thumb{background:#2c313c;border-radius:8px}
.tcard{flex:0 0 260px;min-height:146px;scroll-snap-align:start;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .12s,background .12s}
.tcard:hover,.tcard:focus-visible{background:var(--card2);border-color:#4a5060;transform:scale(1.02)}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--faint)}
.tcard.active::before{background:var(--act)} .tcard.sleeping::before{background:var(--sleep)} .tcard.resolved::before{background:var(--res)}
.tcard.trace::before{background:var(--trace)} .tcard.spark::before{background:var(--spark)} .tcard.spark.faded::before{background:var(--faint)}
.tcard .t{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .small{font-size:12.5px;color:var(--muted)}
.tcard .foot{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint);flex-wrap:wrap}
.life{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.life i{display:block;height:100%;background:var(--spark)}
.chip{font-size:10.5px;letter-spacing:.07em;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap}
.chip.th{background:#2a2245;color:var(--sleep)} .chip.tr{background:#16263a;color:var(--trace)} .chip.sp{background:var(--warn-bg);color:var(--spark)}
.emptyrow{color:var(--faint);font-size:13px;padding:14px 4px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);margin-bottom:22px}
.empty h2{color:var(--text);font-size:22px}
.state{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;font-weight:600}
.state.active{background:#173327;color:var(--act)} .state.sleeping{background:#2a2245;color:var(--sleep)} .state.resolved{background:#26282d;color:var(--res)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv>div:nth-child(odd){color:var(--muted)} .kv .mono{word-break:break-all}
@media (max-width:600px){.kv{grid-template-columns:1fr}.profile,.profile .face{width:130px}.profile .face{height:130px;font-size:48px}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:20;overflow:auto}
.scrim.on{display:flex}
.modal{width:min(820px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.modal .top{padding:20px 22px 0} .modal .body{padding:16px 22px 22px}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 22px;margin-top:14px;flex-wrap:wrap}
.mtab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 12px;color:var(--muted)}
.mtab.on{color:var(--text);border-bottom-color:var(--text)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.timeline li{padding:0 0 14px 16px;position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card2);border:2px solid var(--sleep)}
pre.diag{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:46vh;overflow:auto;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:#111;border-radius:8px;padding:9px 16px;font-size:14px;display:none;z-index:40;max-width:90vw}
.toast.bad{background:var(--bad);color:#111}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(580px,100%);background:var(--bg2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:30;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:8px}
.drawer .content{padding:14px 16px;overflow:auto;flex:1}
.ev{font-size:12.5px;border-bottom:1px solid var(--line);padding:6px 0}
.ev .k{color:var(--spark);margin:0 6px}
.connect{max-width:760px;margin:20px auto}
.connect ol{color:var(--muted);padding-left:20px} .connect ol b{color:var(--text)}
@media (prefers-reduced-motion: reduce){.tcard,.profile .face{transition:none}}
</style>
</head>
<body>
<div class="srcbar wait" id="srcbar">Connecting…</div>
<header>
  <div class="brand">THOUGHT <span>CONTROLLER</span></div>
  <span class="pill" id="srcPill"><span class="dot"></span><span>…</span></span>
  <span class="pill" id="buildPill">…</span>
  <div class="spacer"></div>
  <button class="ghost small" id="btnProfiles" hidden>Profiles</button>
  <button class="ghost small" id="btnSource">Thought engine…</button>
  <button class="ghost small" id="btnLogs">Logs</button>
  <button class="small" id="btnDiag">Copy Diagnostics</button>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="drawer" id="drawer"><div class="head"><b>Thought Controller log</b><span class="faint" style="font-size:13px">newest last</span><div class="spacer"></div><button class="small ghost" id="closeDrawer">Close</button></div><div class="content" id="drawerBody"></div></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial = n => esc((n||"?").trim().charAt(0).toUpperCase());
const when = t => t ? new Date(t).toLocaleString() : "—";
const ago = t => { const s = (Date.now() - new Date(t)) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60)+"m ago"; if (s < 86400) return Math.floor(s/3600)+"h ago"; return new Date(t).toLocaleDateString(); };
const typeLabel = t => ({ai_companion:"AI companion", business:"Business", person:"Person", project:"Project"})[t] || "Other";
let O = null, E = null, view = {mode:"profiles", entity:null}, modalState = null, scanHits = null, lastSig = "", fetchedAt = 0, entityErr = "";

function toast(m, bad){ const t=$("#toast"); t.textContent=m; t.className="toast"+(bad?" bad":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", bad?6500:2500); }
async function api(path, body){
  const o = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)};
  const r = await fetch(path, o); const ct = r.headers.get("content-type")||"";
  const d = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok){ const e = new Error((d && d.error) || ("HTTP "+r.status)); e.status = r.status; throw e; }
  return d;
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { showModal(`<div class="top"><h2>Copy this</h2><p class="muted">The browser blocked the clipboard. Select all and copy.</p></div><div class="body"><textarea style="width:100%;height:50vh;background:var(--bg);color:var(--text)" class="mono">${esc(text)}</textarea><p><button onclick="closeModal()">Close</button></p></div>`, {kind:"copy"}); }
}
const status = () => O && O.status;
const connected = () => O && O.source.state === "CONNECTED" && O.status;
const engineURL = () => "http://" + O.source.address + "/";

async function refresh(poll){
  try { O = await api("/api/overview"); } catch(e){ $("#main").innerHTML = `<div class="banner bad">Thought Controller isn't answering: ${esc(e.message)}</div>`; return; }
  if (connected() && view.entity && !O.status.entities.find(x => x.card.entity_id === view.entity)) view = {mode:"profiles", entity:null};
  if (!connected() && view.mode !== "system") view = {mode:"profiles", entity:null};
  E = null; entityErr = "";
  if (connected() && view.mode === "browse"){
    try { E = await api("/api/entities/" + view.entity); fetchedAt = Date.now(); } catch(e){ entityErr = e.message; }
  }
  renderChrome();
  const sig = JSON.stringify([O.source.state, O.source.address, O.status && [O.status.installation, O.status.profile, O.status.entities.map(x => [x.card, x.grant.enabled, x.counts.traces, x.counts.events, x.counts.thoughts_active, x.counts.thoughts_sleeping, x.counts.thoughts_resolved])],
    E && [E.thoughts, E.traces, E.sparks.map(s => s.spark_id)], entityErr, view, scanHits]);
  if (poll && sig === lastSig){ tickSparks(); return; }
  lastSig = sig;
  render();
}

function renderChrome(){
  const s = O.source, c = O.tc.config, st = status();
  const bar = $("#srcbar"), pill = $("#srcPill");
  if (connected()){
    bar.className = "srcbar live";
    bar.innerHTML = `<b>LIVE</b><span>Reading the Thought engine at <span class="mono">${esc(s.address)}</span> · engine profile <b>${esc(st.profile)}</b> · ${esc(st.config.branch)} @ <span class="mono">${esc(st.config.commit.slice(0,12))}</span></span><span>The engine reports its own mode as</span><span class="mode">${esc(st.mode)}</span>`;
    pill.className = "pill ok"; pill.innerHTML = `<span class="dot"></span>Thought engine: CONNECTED`;
  } else {
    bar.className = s.state === "NOT_CHECKED" ? "srcbar wait" : "srcbar down";
    bar.innerHTML = `<b>${esc(s.label)}</b><span>${esc(s.detail)}</span>`;
    pill.className = "pill bad"; pill.innerHTML = `<span class="dot"></span>Thought engine: ${esc(s.label)}`;
  }
  $("#buildPill").innerHTML = `<span class="mono">${esc(c.commit.slice(0,12))} · ${esc(c.branch)}</span>`; $("#buildPill").title = `Thought Controller ${c.branch} @ ${c.commit}`;
  $("#btnProfiles").hidden = !connected();
}

function render(){
  if (view.mode === "system") return renderSystem();
  if (!connected()) return renderConnect();
  if (view.mode === "browse") return renderBrowse();
  renderProfiles();
}

// ---------- not connected ----------
function renderConnect(){
  const s = O.source;
  $("#main").innerHTML = `<div class="connect">
    <div class="empty" style="text-align:left">
      <h2>Thought Controller needs a running Thought engine</h2>
      <p>Thought Controller shows the real Sparks, Traces and Thoughts that the <b>Thought engine</b> (Arameair/Thought) produces. It doesn't make up any of its own.</p>
      <p class="muted"><b>${esc(s.label)}</b> — ${esc(s.detail)}${s.checked_at ? ` <span class="faint">(checked ${when(s.checked_at)})</span>` : ""}</p>
      <ol>
        <li><b>Play</b> the Thought engine in Project Controller — <b>Arameair/Thought-engine</b> (branch <span class="mono">experiment/thought-engine-v1-20261023</span>, works with Chat-Jimmy), or the earlier Arameair/Thought test prototype — or run it yourself.</li>
        <li>Put its address below, or press <b>Find on this computer</b>.</li>
      </ol>
      <div class="actions" style="margin-top:12px"><input id="addr" class="mono" value="${esc(s.address)}" style="width:220px"><button class="primary" id="saveAddr">Connect</button><button id="scan">Find on this computer</button><button class="ghost" id="retry">Check again</button></div>
      ${scanHTML()}
    </div></div>`;
  wireSource();
}
function scanHTML(){
  if (!scanHits) return "";
  if (!scanHits.length) return `<p class="faint" style="margin-top:10px">No Thought engine found on ports 7778–7899.</p>`;
  return `<table style="margin-top:12px"><tr><th>Address</th><th>Engine</th><th>Build</th><th></th></tr>${scanHits.map(h => `<tr><td class="mono">${esc(h.address)}</td><td>${esc(h.version)}${h.compatible?"":" <b style='color:var(--bad)'>(incompatible)</b>"}<div class="faint">profile ${esc(h.profile)}</div></td><td class="mono">${esc(h.branch)} @ ${esc((h.commit||"").slice(0,12))}</td><td>${h.compatible?`<button class="small" data-use="${esc(h.address)}">Use</button>`:""}</td></tr>`).join("")}</table>`;
}
function wireSource(){
  const sa = $("#saveAddr"); if (sa) sa.onclick = async () => { try { await api("/api/source", {address: $("#addr").value}); scanHits = null; await refresh(); } catch(e){ toast(e.message, true); } };
  const sc = $("#scan"); if (sc) sc.onclick = async () => { sc.disabled = true; sc.textContent = "Searching…"; try { scanHits = (await api("/api/source/scan", {})).hits; } catch(e){ toast(e.message, true); } await refresh(); };
  const rt = $("#retry"); if (rt) rt.onclick = () => refresh();
  document.querySelectorAll("[data-use]").forEach(b => b.onclick = async () => { try { await api("/api/source", {address: b.dataset.use}); scanHits = null; closeModal(); await refresh(); } catch(e){ toast(e.message, true); } });
}

// ---------- profiles ----------
function renderProfiles(){
  const st = status();
  $("#main").innerHTML = problemsHTML() + `
    <div class="who"><h1>Who's thinking?</h1><p class="muted">Identities in the Thought engine's profile <b>${esc(st.profile)}</b>. Pick one to browse its thoughts.</p></div>
    <div class="profiles">
      ${st.entities.map(x => { const c = x.counts, n = c.thoughts_active + c.thoughts_sleeping + c.thoughts_resolved; return `<button class="profile" data-e="${x.card.entity_id}">
        <div class="face ${esc(x.card.entity_type)} ${x.grant.enabled?"":"off"}">${initial(x.card.display_name)}</div>
        <div class="name">${esc(x.card.display_name)}</div>
        <div class="meta">${typeLabel(x.card.entity_type)} · ${n ? n+" thought"+(n>1?"s":"") : "no thoughts yet"}</div>
        <span class="gb ${x.grant.enabled?"on":"offb"}">${x.grant.enabled?"THOUGHT ENABLED":"THOUGHT NOT ENABLED"}</span></button>`; }).join("")}
      <button class="profile" data-sys="1"><div class="face system">⚙</div><div class="name">System Services</div><div class="meta">Thought Controller · Thought engine · Identity</div></button>
    </div>
    ${st.entities.length ? "" : `<div class="empty"><h2>The Thought engine has no identities</h2></div>`}`;
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { view = {mode:"browse", entity:b.dataset.e}; refresh(); });
  document.querySelector("[data-sys]").onclick = () => { view = {mode:"system"}; render(); };
}
function problemsHTML(){
  const st = status();
  return st && st.problems && st.problems.length ? `<div class="banner warn"><b>The Thought engine reports ${st.problems.length} file(s) it couldn't load</b> (it left them untouched):${st.problems.map(p => `<div class="mono">${esc(p.file)} — ${esc(p.reason)}</div>`).join("")}</div>` : "";
}

function tabsHTML(){
  const st = status();
  return `<div class="tabs">${(st ? st.entities : []).map(x => { const n = x.counts.thoughts_active + x.counts.thoughts_sleeping + x.counts.thoughts_resolved; return `<button class="tab ${view.entity===x.card.entity_id?"on":""}" data-e="${x.card.entity_id}"><span class="mini face ${esc(x.card.entity_type)} ${x.grant.enabled?"":"off"}">${initial(x.card.display_name)}</span>${esc(x.card.display_name)} <span class="faint">${n}</span></button>`; }).join("")}
    <button class="tab ${view.mode==="system"?"on":""}" data-sys="1"><span class="mini face system" style="font-size:13px">⚙</span>System Services</button></div>`;
}
function wireTabs(){
  document.querySelectorAll(".tabs [data-e]").forEach(b => b.onclick = () => { view = {mode:"browse", entity:b.dataset.e}; refresh(); });
  document.querySelector(".tabs [data-sys]").onclick = () => { view = {mode:"system"}; render(); };
}

// ---------- identity ----------
function thoughtCard(t){
  return `<button class="tcard ${t.state}" data-t="${t.thought_id}"><div class="t">${esc(t.question)}</div>
    <div class="small">${t.trace_ids.length} clue${t.trace_ids.length===1?"":"s"} · topic ${esc(t.topic)}</div>
    <div class="foot"><span class="chip th">THOUGHT</span><span class="state ${t.state}">${t.state}</span><span>${ago(t.updated_at)}</span></div></button>`;
}
function traceCard(x){
  return `<button class="tcard trace" data-tr="${x.trace_id}"><div class="t">${esc(x.summary)}</div>
    <div class="small">event <span class="mono">${esc(x.source_event_id)}</span></div>
    <div class="small">${x.thought_id ? "Evidence for: " + esc(x.thought_question) : "Not yet part of a Thought"}</div>
    <div class="foot"><span class="chip tr">TRACE</span><span>${ago(x.created_at)}</span></div></button>`;
}
function sparkRemaining(s){ return Math.max(0, s.remaining_ms - (Date.now() - fetchedAt)); }
function sparkCard(s){
  const life = s.remaining_ms > 0 ? Math.round(100 * sparkRemaining(s) / Math.max(1, (new Date(s.expires_at) - new Date(s.created_at)))) : 0;
  return `<div class="tcard spark ${life>0?"":"faded"}" data-sp="${s.spark_id}"><div class="t">${esc(s.summary)}</div>
    <div class="small">importance ${s.importance.toFixed(1)} · left behind: <b>${esc(s.left_behind)}</b></div>
    <div class="small">${esc(s.outcome)}</div>
    <div class="life"><i style="width:${life}%"></i></div>
    <div class="foot"><span class="chip sp">✦ SPARK</span><span class="st">${life>0?"glowing":"faded"}</span><span>${ago(s.created_at)}</span></div></div>`;
}
function tickSparks(){
  if (!E) return;
  E.sparks.forEach(s => { const el = document.querySelector(`[data-sp="${s.spark_id}"]`); if (!el) return;
    const total = Math.max(1, new Date(s.expires_at) - new Date(s.created_at)), p = Math.round(100 * sparkRemaining(s) / total);
    el.querySelector(".life i").style.width = p + "%"; el.querySelector(".st").textContent = p > 0 ? "glowing" : "faded"; el.classList.toggle("faded", p <= 0); });
}
function rail(title, sub, items, card, empty){
  return `<section class="row"><h2>${title} <span class="n">${items.length}</span></h2>${sub?`<div class="sub">${sub}</div>`:""}<div class="rail">${items.length ? items.map(card).join("") : `<div class="emptyrow">${empty}</div>`}</div></section>`;
}
function renderBrowse(){
  const m = $("#main");
  if (!E){ m.innerHTML = tabsHTML() + `<div class="banner bad">${esc(entityErr || "Loading…")}</div>`; wireTabs(); return; }
  const c = E.card, on = E.grant.enabled, th = E.thoughts, k = E.counts, rule = status().rule_text;
  const byUpd = (a, b) => new Date(b.updated_at) - new Date(a.updated_at);
  const open = th.filter(t => t.state !== "resolved").sort(byUpd);
  const traces = E.traces.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  m.innerHTML = problemsHTML() + tabsHTML() + `
    <section class="hero">
      <div class="face ${esc(c.entity_type)} ${on?"":"off"}">${initial(c.display_name)}</div>
      <div><h1>${esc(c.display_name)}</h1>
        <div class="muted">${typeLabel(c.entity_type)} · <span class="mono">${esc(c.entity_id)}</span> <button class="small ghost" id="cpEid">Copy ID</button></div>
        <div class="counts"><span class="count"><b>${k.thoughts_active}</b>Active</span><span class="count"><b>${k.thoughts_sleeping}</b>Sleeping</span><span class="count"><b>${k.thoughts_resolved}</b>Resolved</span>
          <span class="count"><b>${k.traces}</b>Traces</span><span class="count"><b>${k.events}</b>Events</span><span class="count"><b>${k.sparks_visible}</b>Sparks glowing</span></div>
      </div>
      <div class="side"><span class="gb ${on?"on":"offb"}" style="font-size:12px">${on?"THOUGHT PROCESSING ENABLED":"THOUGHT PROCESSING NOT ENABLED"}</span>
        <div class="faint" style="font-size:12px;margin-top:6px;max-width:260px">${esc(E.grant.kind)}</div></div>
    </section>
    ${on ? "" : `<div class="banner">Thought Processing is not enabled for <b>${esc(c.display_name)}</b>, so the Thought engine refuses new events and changes for it. It is switched on in the Thought engine (<a href="${esc(engineURL())}" target="_blank" rel="noopener">open the engine</a>); later Identity will grant it. Anything already saved is shown read-only.</div>`}
    ${th.length === 0 ? `<div class="empty"><h2>No thoughts yet</h2><p>The Thought engine has no Thoughts for <b>${esc(c.display_name)}</b>.</p><p class="muted">Thoughts form in the engine from real events. Rule now: ${esc(rule)}.<br>Send events from the <a href="${esc(engineURL())}" target="_blank" rel="noopener">Thought engine's page</a>; they appear here within a couple of seconds.</p></div>` :
      rail("Continue Thinking", "Open Thoughts, most recently changed first", open, thoughtCard, "Nothing open right now.") +
      rail("Active", "", th.filter(t => t.state === "active").sort(byUpd), thoughtCard, "No active Thoughts.") +
      rail("Sleeping / Waiting", "A related event will wake these", th.filter(t => t.state === "sleeping").sort(byUpd), thoughtCard, "Nothing sleeping.") +
      rail("Resolved / History", "", th.filter(t => t.state === "resolved").sort(byUpd), thoughtCard, "Nothing resolved yet.")}
    ${rail("Recent evidence", "Traces: saved clues, each tied to the event that caused it", traces, traceCard, "No Traces yet.")}
    ${rail("Sparks", "Brief flashes from this run of the engine — they are not saved and vanish when the engine restarts", E.sparks, sparkCard, "No Sparks in this run of the engine.")}`;
  wireTabs();
  $("#cpEid").onclick = () => copyText(c.entity_id);
  m.querySelectorAll("[data-t]").forEach(b => b.onclick = () => openThought(b.dataset.t, "details"));
  m.querySelectorAll("[data-tr]").forEach(b => b.onclick = () => openTrace(b.dataset.tr));
}

// ---------- thought detail ----------
async function openThought(tid, tab){
  let d; try { d = await api(`/api/entities/${view.entity}/thoughts/${tid}`); } catch(e){ return toast(e.message, true); }
  modalState = {kind:"thought", tid, tab: tab || "details", d}; drawThought();
}
function drawThought(){
  const {d, tab} = modalState, t = d.thought, on = E && E.grant.enabled;
  let body = "";
  if (tab === "details"){
    body = `<div class="kv">
      <div>Why it formed</div><div><b>${esc(t.formation_reason)}</b></div>
      <div>Topic</div><div class="mono">${esc(t.topic)}</div>
      <div>Belongs to</div><div>${esc(E.card.display_name)} <span class="mono faint">${esc(t.entity_id)}</span></div>
      <div>Formed</div><div>${when(t.created_at)}</div><div>Last change</div><div>${when(t.updated_at)}</div>
      <div>Clues</div><div>${t.trace_ids.length} (${t.origin_trace_ids.length} formed it)</div>
      <div>Question by</div><div>${esc(t.question_by || "the Thought engine's rules (no AI worker)")}</div>
      <div>Notes</div><div>${(t.notes||[]).length ? (t.notes||[]).length + " — see Development history" : "none yet"}</div></div>
    <h2 style="margin-top:18px">Ask the engine to change it</h2>
    ${canThink() && t.state!=="resolved" ? `<div class="actions" style="margin-bottom:10px"><button class="primary" data-a="think">Think once</button><span class="faint" style="font-size:12.5px">The engine asks its AI worker for one new note on this Thought.</span></div>` : ""}
    <div class="actions">${t.state==="active"?`<button data-a="sleep">Sleep</button>`:""}${t.state==="sleeping"?`<button data-a="wake">Wake</button>`:""}${t.state!=="resolved"?`<button data-a="resolve">Resolve</button>`:`<button data-a="reopen">Reopen</button>`}
      <span class="faint" style="font-size:12.5px">${on ? "The Thought engine checks the permission and the Thought's state, then saves the change." : "Thought Processing is not enabled for this identity — the engine will refuse changes."}</span></div>
    <div id="actErr"></div>`;
  } else if (tab === "evidence"){
    body = `<table><tr><th></th><th>Source event</th><th>What</th><th>Why kept</th><th>When</th></tr>${d.evidence.map(v => `<tr>
      <td>${v.missing ? `<span class="chip" style="background:var(--bad-bg);color:var(--bad)">MISSING</span>` : v.origin ? `<span class="chip th">FORMED IT</span>` : `<span class="chip tr">LATER</span>`}</td>
      <td class="mono">${esc(v.trace.source_event_id || "")}</td><td>${esc(v.trace.summary || "")}</td><td class="faint">${esc(v.trace.reason || "")}</td><td class="faint">${v.event ? when(v.event.received_at) : ""}</td></tr>`).join("")}</table>
      <p class="faint" style="font-size:12.5px;margin-top:8px">Every row is a Trace the engine saved, linked to the event that caused it.</p>`;
  } else if (tab === "history"){
    body = `<ul class="timeline">${t.history.map(h => `<li><b>${esc(h.kind)}</b>${h.from||h.to?` <span class="faint">${esc(h.from||"")}${h.from?" → ":""}${esc(h.to||"")}</span>`:""} <span class="faint">${when(h.at)}</span><div class="muted">${esc(h.detail)}</div>${h.event_id?`<div class="faint mono">event ${esc(h.event_id)}</div>`:""}</li>`).join("")}</ul>`;
  } else {
    const txt = thoughtDiag(d);
    body = `<pre class="diag">${esc(txt)}</pre><button id="cpTd">Copy thought diagnostics</button>`;
  }
  showModal(`<div class="top"><div class="actions"><span class="chip th">THOUGHT</span><span class="state ${t.state}">${t.state}</span><div class="spacer"></div><button class="small ghost" onclick="closeModal()">Close</button></div>
    <h1 style="font-size:24px;margin-top:10px">${esc(t.question)}</h1><div class="faint mono">${esc(t.thought_id)} <button class="small ghost" id="cpTid">Copy ID</button></div></div>
    <div class="mtabs">${[["details","Details"],["evidence",`Evidence (${d.evidence.length})`],["history","Development history"],["diag","Diagnostics"]].map(([k,l]) => `<button class="mtab ${tab===k?"on":""}" data-m="${k}">${l}</button>`).join("")}</div>
    <div class="body">${body}</div>`);
  $("#cpTid").onclick = () => copyText(t.thought_id);
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { modalState.tab = b.dataset.m; drawThought(); });
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => act(t.thought_id, b.dataset.a));
  const cp = $("#cpTd"); if (cp) cp.onclick = () => copyText(thoughtDiag(d));
}
function canThink(){ const st = status(); return !!(st && st.features && st.features.includes("think")); }
function thoughtDiag(d){
  const t = d.thought, s = O.source, st = status();
  return [`## Thought diagnostics (${new Date().toISOString()})`, "",
    `- thought_id ${t.thought_id}`, `- entity_id ${t.entity_id}`, `- installation_id ${t.installation_id}`,
    `- state ${t.state} · topic ${t.topic} · traces ${t.trace_ids.length} (origin ${t.origin_trace_ids.length})`,
    `- formed ${t.created_at} · updated ${t.updated_at}`, `- reason: ${t.formation_reason}`,
    `- evidence events: ${d.evidence.map(v => v.trace.source_event_id + (v.missing ? " (MISSING)" : "")).join(", ")}`,
    `- source: Thought engine ${st.config.version} at ${s.address} · ${st.config.branch} @ ${st.config.commit} · engine mode: ${st.mode}`,
    `- shown by Thought Controller ${O.tc.config.branch} @ ${O.tc.config.commit} · instance ${O.tc.instance.instance_id}`, "",
    "### Lifecycle", ...t.history.map(h => `- ${h.at} ${h.kind}${h.from||h.to ? ` ${h.from||"∅"}→${h.to}` : ""}${h.event_id ? " (event " + h.event_id + ")" : ""}`), "",
    "_Question text and event summaries are left out._"].join("\n");
}
async function act(tid, action){
  if (action === "think"){ const b = document.querySelector('[data-a="think"]'); if (b){ b.disabled = true; b.textContent = "Thinking…"; } }
  try {
    await api(`/api/entities/${view.entity}/thoughts/${tid}`, {action});
    toast("The Thought engine " + ({sleep:"put it to sleep", wake:"woke it", resolve:"resolved it", reopen:"reopened it", think:"added a note from its AI worker"}[action]));
    await refresh(); await openThought(tid, "details");
  } catch(e){
    const el = $("#actErr"); if (el) el.innerHTML = `<div class="banner bad" style="margin-top:12px">The Thought engine refused: ${esc(e.message)}</div>`; else toast(e.message, true);
  }
}
function openTrace(id){
  const x = E.traces.find(t => t.trace_id === id); if (!x) return;
  modalState = {kind:"trace"};
  showModal(`<div class="top"><div class="actions"><span class="chip tr">TRACE</span><div class="spacer"></div><button class="small ghost" onclick="closeModal()">Close</button></div>
    <h1 style="font-size:22px;margin-top:10px">${esc(x.summary)}</h1><div class="faint mono">${esc(x.trace_id)}</div></div>
    <div class="body"><div class="kv">
      <div>Source event</div><div class="mono">${esc(x.source_event_id)}</div><div>Why kept</div><div>${esc(x.reason)}</div>
      <div>Topic</div><div class="mono">${esc(x.topic)}</div><div>Importance</div><div>${x.importance.toFixed(1)}</div><div>Saved</div><div>${when(x.created_at)}</div>
      <div>Evidence for</div><div>${x.thought_id ? `<button class="small" id="toThought">${esc(x.thought_question)}</button>` : "Not yet part of a Thought" + (x.expires_at ? ` — expires ${when(x.expires_at)} if unused` : "")}</div></div></div>`);
  const b = $("#toThought"); if (b) b.onclick = () => openThought(x.thought_id, "evidence");
}
function showModal(html, st){ $("#modal").innerHTML = html; $("#scrim").classList.add("on"); if (st) modalState = st; }
function closeModal(){ $("#scrim").classList.remove("on"); modalState = null; }
$("#scrim").onclick = e => { if (e.target.id === "scrim") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeModal(); $("#drawer").classList.remove("on"); } });

// ---------- system services ----------
function renderSystem(){
  const tc = O.tc, c = tc.config, s = O.source, e = s.engine, k = s.counters;
  $("#main").innerHTML = (connected() ? tabsHTML() : "") + `
    <section class="hero"><div class="face system" style="width:96px;height:96px;border-radius:12px;display:grid;place-items:center;font-size:40px">⚙</div>
      <div><h1>System Services</h1><div class="muted">Three separate services. Each shows its real state.</div></div><div></div></section>
    <div class="grid">
      <div class="panel"><h2>Thought Controller (this dashboard)</h2><div class="kv">
        <div>Instance ID</div><div class="mono">${esc(tc.instance.instance_id)}</div><div>Created</div><div>${when(tc.instance.created_at)}</div>
        <div>Build</div><div class="mono">${esc(c.branch)} @ ${esc(c.commit)}</div><div>Branch source</div><div>${esc(c.branch_source)}${c.detached?" · detached checkout":""}</div>
        <div>Port · pid</div><div class="mono">${esc(c.port)} · ${tc.pid}</div><div>Data folder</div><div class="mono">${esc(c.data_dir)} <span class="faint">(${esc(c.data_source)})</span></div>
        <div>Stores</div><div>Only its instance ID, the engine address and its log. Thought data stays in the engine.</div>
        <div>Does not</div><div>think, launch programs, call AI models or contact GitHub</div></div></div>
      <div class="panel"><h2>Thought engine</h2><div class="kv">
        <div>Address</div><div class="mono">${esc(s.address)} <button class="small ghost" id="chg">Change…</button></div>
        <div>State</div><div><b>${esc(s.label)}</b> — ${esc(s.detail)}</div>
        ${e ? `<div>Version</div><div class="mono">${esc(e.version)}</div><div>Build</div><div class="mono">${esc(e.branch)} @ ${esc(e.commit)}</div>
        <div>Thought service ID</div><div class="mono">${esc(e.thought_service_id)}</div><div>Installation</div><div class="mono">${esc(e.installation_id)}</div>
        <div>Profile</div><div>${esc(e.profile)}</div><div>Mode (engine's own)</div><div>${esc(e.mode)}</div><div>Rule</div><div>${esc(e.rule_text)}</div>
        <div>Identities</div><div>${e.identities} (${e.identities_enabled} with Thought enabled)</div>` : ""}
        <div>Last check</div><div>${s.checked_at ? when(s.checked_at) + " · " + s.latency_ms + " ms" : "—"}</div>
        <div>Traffic since start</div><div>${k.reads} reads · ${k.read_errors} errors · ${k.actions_sent} owner actions (${k.actions_accepted} accepted, ${k.actions_refused} refused by the engine)</div>
        ${s.last_error ? `<div>Last error</div><div class="faint">${esc(s.last_error)} (${when(s.last_error_at)})</div>` : ""}
        ${connected() ? `<div>Engine page</div><div><a href="${esc(engineURL())}" target="_blank" rel="noopener">${esc(engineURL())}</a></div>` : ""}</div></div>
      <div class="panel"><h2>Identity</h2><div class="kv"><div>State</div><div><b>${esc(O.identity.state)}</b></div><div>Why</div><div>${esc(O.identity.detail)}</div></div></div>
    </div>`;
  if (connected()) wireTabs();
  $("#chg").onclick = sourceDialog;
}
function sourceDialog(){
  showModal(`<div class="top"><h2>Thought engine address</h2><p class="muted">Where the Thought engine runs on this computer. In Project Controller, use the port on the Thought pane.</p></div>
    <div class="body"><div class="actions"><input id="addr" class="mono" value="${esc(O.source.address)}" style="width:220px"><button class="primary" id="saveAddr">Connect</button><button id="scan">Find on this computer</button></div>${scanHTML()}
    <p style="margin-top:14px"><button class="ghost" onclick="closeModal()">Close</button></p></div>`, {kind:"source"});
  wireSource();
  const sa = $("#saveAddr"); sa.onclick = async () => { try { await api("/api/source", {address: $("#addr").value}); scanHits = null; closeModal(); await refresh(); } catch(e){ toast(e.message, true); } };
  const sc = $("#scan"); sc.onclick = async () => { sc.disabled = true; sc.textContent = "Searching…"; try { scanHits = (await api("/api/source/scan", {})).hits; } catch(e){ toast(e.message, true); } sourceDialog(); };
}

// ---------- header ----------
$("#btnDiag").onclick = async () => { try { copyText(await api("/api/diagnostics")); } catch(e){ toast(e.message, true); } };
$("#btnProfiles").onclick = () => { view = {mode:"profiles"}; render(); };
$("#btnSource").onclick = sourceDialog;
$("#btnLogs").onclick = () => {
  $("#drawerBody").innerHTML = (O.tc.events_error ? `<div class="banner bad">${esc(O.tc.events_error)}</div>` : "") + O.tc.events.map(e => `<div class="ev"><span class="faint">${new Date(e.at).toLocaleTimeString()}</span><span class="k">${esc(e.kind)}</span>${esc(e.detail)}</div>`).join("");
  $("#drawer").classList.add("on"); };
$("#closeDrawer").onclick = () => $("#drawer").classList.remove("on");

refresh();
setInterval(() => {
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (!document.hidden && !typing && !modalState) refresh(true);
}, 2000);
setInterval(tickSparks, 250);
</script>
</body>
</html>
